ABOUT_TEXT: "American Korean Taekwondo Team Center has been Teaneck's Kukkiwon- and USA Taekwondo-certified academy since 2016, and expanded to a second location in Bergenfield in 2025. Known as the 'Home of National Champions' in the sparring division, the academy builds martial artists around five core values — focus, confidence, respect, self-control, and mental strength — in a safe, structured, and inspiring environment for every age."

INSTRUCTOR_1_NAME: "Grandmaster James Koh"
INSTRUCTOR_1_PHOTO: images/instructors/instructor-1/photo.jpg
INSTRUCTOR_1_TITLE: "Founder & Head Master — 6th Dan Black Belt"
INSTRUCTOR_1_BIO: "Grandmaster James Koh is a Kukkiwon International Master Certified 6th Dan Black Belt with more than 20 years of teaching experience and 30+ years of training. A former elite competitor with 15 years of sparring experience, he holds USA Taekwondo Gold, South Korea National Gold, and International Gold medals. He founded American Korean Taekwondo in Teaneck in 2016 and expanded to Bergenfield in 2025."

INSTRUCTOR_2_NAME: "Master Daria Kalyniuk"
INSTRUCTOR_2_PHOTO: images/instructors/instructor-2/daria-kalyniuk.jpg
INSTRUCTOR_2_TITLE: "Instructor — 4th Degree Black Belt"
INSTRUCTOR_2_BIO: "Master Daria Kalyniuk is a 4th Degree WTF Kukkiwon Black Belt and ITF 1st Degree Black Belt with more than 10 years of training experience. She's a SafeSport-certified coach and USA Taekwondo licensed coach and referee, and earned a national title at the Ukrainian Championships. Master Daria brings patient, hands-on instruction to every class, especially our youngest Little Tigers."

INSTRUCTOR_3_NAME: "Instructor Ethan"
INSTRUCTOR_3_TITLE: "Instructor — 3rd Dan Black Belt"
INSTRUCTOR_3_BIO: "Instructor Ethan is a Kukkiwon 3rd Dan Black Belt with 6 years of teaching experience, having competed in both New Jersey and New York State Championships. He brings energy and discipline to every class he teaches."

