REVIEWER_1_NAME: "Lanfang Dong"
REVIEWER_1_DATE: "8 months ago"
REVIEWER_1_TEXT: "This has to be your first choice for a Taekwondo School. They have the best Master anyone could ask for. My kids started Taekwondo right after Covid and they've loved it since they started. They got much more confident after starting Taekwondo and are excited to take it every week. Master James is an amazing coach, being fun and strict at the same time. All the kids there are like one huge family, and Instructor Daria is very nice and helpful along with Master James. They both help out all the kids and the experience is amazing."

REVIEWER_2_NAME: "Korxten Media"
REVIEWER_2_DATE: "5 months ago"
REVIEWER_2_TEXT: "The master is fantastic with kids — firm enough to teach real discipline, yet genuinely caring in a way that makes them feel supported. You can see how much the students respect him, and at the same time they're clearly having fun while learning. Send your kids here!"

REVIEWER_3_NAME: "Jadys Ruiz"
REVIEWER_3_DATE: "4 years ago"
REVIEWER_3_TEXT: "Master James is not only the best Master I have met in this journey of finding a good school for my son but he is the most personable and most humble I've met! He is so good with the kids, stern in his teachings but understanding. Makes them feel comfortable and makes sure they learn."

